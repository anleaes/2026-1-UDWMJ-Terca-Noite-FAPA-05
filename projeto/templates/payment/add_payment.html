{% extends 'base.html' %}
{% block title %}
    Register Payment - {{ block.super }}
{% endblock title %}
{% block body %}
<main class="form-page">
    <section class="form-card">
        <h1 class="form-title">Register Payment for Order #{{ order.id }}</h1>
        <form action="" method="POST">
            {% csrf_token %}
            <label>Payment Method</label>
            {{ form.payment_method }}
            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
                <a class="btn" href="{% url 'order:edit_order' order.id %}">Back to Order</a>
            </div>
        </form>
    </section>
</main>
{% endblock body %}
