{% extends 'base.html' %}
{% block title %}
    Register Order - {{ block.super }}
{% endblock title %}
{% block body %}
<main class="form-page">
    <section class="form-card">
        <h1 class="form-title">Register Order</h1>
        <form action="" method="POST">
            {% csrf_token %}
            <label>Date Created</label>
            {{ form.date_created }}
            <label>Status</label>
            {{ form.status }}
            <label>Total Price</label>
            {{ form.total_price }}
            <label>Client</label>
            {{ form.client }}
            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </section>
</main>
{% endblock body %}
