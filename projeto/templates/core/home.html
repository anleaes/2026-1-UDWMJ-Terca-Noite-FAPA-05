{% extends 'base.html' %}

{% block title %}Home - {{ block.super }}{% endblock title %}

{% block body %}
<main class="home">
    <h1>Cinema App</h1>

    {% if user.is_authenticated %}
    <p>Welcome, {{ user.username }}.</p>
    {% else %}
    <p>Sign in or create an account to manage orders and your profile.</p>
    {% endif %}
</main>
{% endblock body %}
