{% extends 'base.html' %}

{% block title %}
    Register Room - {{ block.super }}
{% endblock title %}

{% block body %}
<main class="form-page">
    <section class="form-card">
        <h1 class="form-title">Register Room for {{ cinema.name }}</h1>
        <form method="POST">
            {% csrf_token %}
            <label>Rows</label>
            {{ form.rows }}
            <label>Columns</label>
            {{ form.columns }}
            <label>Projection Type</label>
            {{ form.projection_type }}
            <label>Accessibility</label>
            {{ form.accessibility }}
            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
                <a class="btn" href="{% url 'cinema:edit_cinema' cinema.id %}">Back to Cinema</a>
            </div>
        </form>
    </section>
</main>

{% endblock body %}
