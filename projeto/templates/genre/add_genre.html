{% extends 'base.html' %}
{% block title %}
    Register Genre - {{ block.super }}
{% endblock title %}
{% block body %}
<main class="form-page">
    <section class="form-card">
        <h1 class="form-title">Register Genre</h1>
        <form action="" method="POST">
            {% csrf_token %}
            <label>Name</label>
            {{ form.name }}
            <label>Description</label>
            {{ form.description }}
            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </section>
</main>
{% endblock body %}
