{% extends 'base.html' %}

{% load widget_tweaks %}

{% block title %}
    New User - {{ block.super}}
{% endblock title %}

{% block body %}

<br />
<p>Change User</p>
<br />
<br />
<form action="" method="POST">
{% csrf_token %}
    <label>First Name</label>
    <br />
    {{ form.first_name|attr:"autofocus" }}
    <br />
    <br />
    <label>Last Name</label>
    <br />
    {{ form.last_name }}
    <br />
    <br />
    <label>Email</label>
    <br />
    {{ form.email }}
    <br />
    <br />
    <button type="submit">Save</button>
</form>

{% endblock body %}
