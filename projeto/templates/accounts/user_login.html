{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Cinema App Login</title>
  <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}">
</head>
<body>
    <form action="" method="POST">
    {% csrf_token %}
    <b>Identify yourself</b>
    <br />
    <label>Username</label>
    <br />
    <input type="text" id="username" name="username" placeholder="Username" required autofocus>
    <br />
    <label>Password</label>
    <br />
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <br />
    <button type="submit">Enter</button>
    <br />
    <a href="{% url 'accounts:add_user' %}">Create an account</a>
  </form>
  <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>
</html>
