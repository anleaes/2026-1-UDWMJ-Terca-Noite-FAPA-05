{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Cinema App Login</title>
  <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}?v=5">
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <form action="" method="POST" class="auth-card">
      {% csrf_token %}
      <h1>Cinema App</h1>

      <label for="username">Login</label>
      <input type="text" id="username" name="username" placeholder="Username" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required>

      <div class="auth-actions">
        <button type="submit" class="btn auth-btn">Login</button>
        <a class="btn auth-btn secondary" href="{% url 'accounts:add_user' %}">Create an account</a>
      </div>
    </form>
  </main>
  <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>
</html>
